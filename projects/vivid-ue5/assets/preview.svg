<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e"/>
      <stop offset="50%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#141a30"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Glow Orbs -->
  <circle cx="220" cy="180" r="190" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1020" cy="420" r="220" fill="#06b6d4" opacity="0.14" filter="url(#glow)"/>
  <circle cx="650" cy="120" r="140" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>

  <!-- Left Side: Title & Info -->
  <g transform="translate(80, 100)">
    <!-- Active Status Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)"/>
      <circle cx="20" cy="17" r="5" fill="#10b981"/>
      <circle cx="20" cy="17" r="9" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
      <text x="36" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1.2">ACTIVE POE AGENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Outfit', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Vivid-Architect
    </text>
    <text x="0" y="130" font-family="'Outfit', sans-serif" font-size="28" font-weight="600" fill="url(#accentGrad)">
      Autonomous Unreal Engine 5 Dev Agent
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="180" font-family="'Outfit', sans-serif" font-size="17" fill="#94a3b8" width="480">
      <tspan x="0" dy="0">Fine-tuned Qwen2.5-Coder-1.5B with indexed 57MB</tspan>
      <tspan x="0" dy="26">Epic Games engine corpus. Scaffolds paired C++</tspan>
      <tspan x="0" dy="26">actors, validates Hungarian notation &amp; injects Build.cs.</tspan>
    </text>

    <!-- Specs Pills -->
    <g transform="translate(0, 290)">
      <!-- Spec 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="145" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
        <text x="72" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Rank-16 LoRA SFT</text>
      </g>
      <!-- Spec 2 -->
      <g transform="translate(155, 0)">
        <rect x="0" y="0" width="145" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
        <text x="72" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">57MB Engine RAG</text>
      </g>
      <!-- Spec 3 -->
      <g transform="translate(310, 0)">
        <rect x="0" y="0" width="165" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
        <text x="82" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">RTX 3070 Ti (8GB)</text>
      </g>
    </g>

    <!-- Poe Bot Callout -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="475" height="54" rx="12" fill="rgba(16, 185, 129, 0.06)" stroke="rgba(16, 185, 129, 0.25)"/>
      <text x="24" y="33" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#34d399">
        Poe Handle: @Vivid86-DevAgent
      </text>
      <text x="450" y="33" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#10b981" text-anchor="end">
        FastAPI Bridge ↗
      </text>
    </g>
  </g>

  <!-- Right Side: Terminal / Code Inspector Card -->
  <g transform="translate(620, 80)">
    <!-- Main Window Frame -->
    <rect x="0" y="0" width="500" height="470" rx="16" fill="#0b0e17" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    
    <!-- Window Title Bar -->
    <rect x="0" y="0" width="500" height="44" rx="16" fill="rgba(255, 255, 255, 0.04)"/>
    <rect x="0" y="30" width="500" height="14" fill="rgba(255, 255, 255, 0.04)"/>
    <circle cx="24" cy="22" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="44" cy="22" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="64" cy="22" r="6" fill="#10b981" opacity="0.8"/>
    <text x="250" y="27" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" text-anchor="middle">vivid_ue5_agent.py — REPL &amp; Poe Bridge</text>

    <!-- Terminal Code Body -->
    <g transform="translate(24, 66)">
      <!-- Prompt Line -->
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="13" fill="#10b981">&gt; /scaffold AProceduralDungeon AActor</text>
      
      <!-- Execution status -->
      <text x="0" y="48" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">[*] Querying 57MB UE5 Engine Corpus (1,619 headers)...</text>
      <text x="0" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">[✓] Found UProceduralMeshComponent, USceneComponent</text>
      
      <!-- C++ Code Snippet Box -->
      <g transform="translate(0, 95)">
        <rect x="0" y="0" width="452" height="180" rx="8" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.06)"/>
        
        <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">
          <tspan fill="#64748b">#include </tspan><tspan fill="#38bdf8">"CoreMinimal.h"</tspan>
        </text>
        <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">
          <tspan fill="#64748b">#include </tspan><tspan fill="#38bdf8">"ProceduralDungeon.generated.h"</tspan>
        </text>
        <text x="16" y="80" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f59e0b">UCLASS()</text>
        <text x="16" y="104" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ffffff">
          <tspan fill="#ec4899">class </tspan><tspan fill="#34d399">MYPROJECT_API </tspan><tspan fill="#facc15">AProceduralDungeon </tspan><tspan fill="#ec4899">: public </tspan><tspan fill="#facc15">AActor</tspan>
        </text>
        <text x="16" y="128" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">{</text>
        <text x="32" y="148" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f59e0b">GENERATED_BODY()</text>
        <text x="16" y="168" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">public:</text>
      </g>

      <!-- Validator Status & Output -->
      <g transform="translate(0, 295)">
        <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399">
          ✓ Heuristic AST: Hungarian prefix 'A' verified
        </text>
        <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399">
          ✓ Injected "ProceduralMeshComponent" into .Build.cs
        </text>
        <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a78bfa">
          ⚡ Poe Event: PartialResponse streamed to @Vivid86-DevAgent
        </text>
      </g>
    </g>
  </g>
</svg>